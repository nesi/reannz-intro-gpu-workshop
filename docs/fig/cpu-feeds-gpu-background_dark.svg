<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 305" width="700" height="305" role="img" aria-label="The four-core timeline again, but two of the cores spend the whole job on a background CPU job. Only two cores prepare batches, so the GPU computes two batches and then waits, idle, for the next two, even though every core is busy.">
  <title>Four busy cores, two of them on work the GPU never uses</title>
  <desc>Cores 1 and 2 prepare batches two at a time, each taking 180 units. Cores 3 and 4 spend the whole job on a background CPU job that the GPU never waits for. The GPU computes each pair of batches in 140 units and then waits 40 units for the next pair, so it is idle again although all four cores are busy.</desc>

  <defs>
    <!-- Same hatch as the other two figures, so all three can be compared directly. -->
    <pattern id="idleHatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#2a2016"/>
      <rect width="3" height="8" fill="#f8961d" opacity="0.38"/>
    </pattern>
    <marker id="handoff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c3d4e0" opacity="0.6"/>
    </marker>
    <marker id="timeArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c3d4e0" opacity="0.6"/>
    </marker>
    <!-- The tracks run off the right edge rather than stopping dead: a
         luminance mask fades them out, and an ellipsis follows. -->
    <linearGradient id="fadeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <mask id="fadeRight" maskUnits="userSpaceOnUse" x="0" y="0" width="700" height="305">
      <rect x="0" y="0" width="605" height="305" fill="#ffffff"/>
      <rect x="605" y="0" width="55" height="305" fill="url(#fadeGrad)"/>
    </mask>
  </defs>

  <g font-family="Mukta, 'Helvetica Neue', Helvetica, Arial, sans-serif">

    <!-- Row labels -->
    <text x="76" y="51"  font-size="12" font-weight="700" fill="#e9f1f7" text-anchor="end">CPU core 1</text>
    <text x="76" y="89"  font-size="12" font-weight="700" fill="#e9f1f7" text-anchor="end">CPU core 2</text>
    <text x="76" y="127" font-size="12" font-weight="700" fill="#e9f1f7" text-anchor="end">CPU core 3</text>
    <text x="76" y="165" font-size="12" font-weight="700" fill="#e9f1f7" text-anchor="end">CPU core 4</text>
    <text x="76" y="219" font-size="15" font-weight="700" fill="#e9f1f7" text-anchor="end">GPU</text>

    <g font-size="12" fill="#04202f" font-weight="600" text-anchor="middle" mask="url(#fadeRight)">
      <!-- Cores 1 and 2 prepare batches exactly as in the four-core figure,
           180 units each, but there are only two of them now. -->
      <g>
        <rect x="90"  y="30" width="180" height="32" rx="4" fill="#23abe3"/>
        <rect x="270" y="30" width="180" height="32" rx="4" fill="#23abe3"/>
        <rect x="450" y="30" width="180" height="32" rx="4" fill="#23abe3"/>
        <rect x="624" y="30" width="186" height="32" rx="4" fill="#23abe3"/>
        <path d="M 270 30 L 270 62 M 450 30 L 450 62" stroke="#0d1b2a" stroke-width="2" opacity="0.85"/>
        <text x="180" y="51">batch 1</text>
        <text x="360" y="51">batch 3</text>
        <text x="540" y="51">batch 5</text>
      </g>
      <g>
        <rect x="90"  y="68" width="180" height="32" rx="4" fill="#23abe3"/>
        <rect x="270" y="68" width="180" height="32" rx="4" fill="#23abe3"/>
        <rect x="450" y="68" width="180" height="32" rx="4" fill="#23abe3"/>
        <rect x="624" y="68" width="186" height="32" rx="4" fill="#23abe3"/>
        <path d="M 270 68 L 270 100 M 450 68 L 450 100" stroke="#0d1b2a" stroke-width="2" opacity="0.85"/>
        <text x="180" y="89">batch 2</text>
        <text x="360" y="89">batch 4</text>
        <text x="540" y="89">batch 6</text>
      </g>

      <!-- Cores 3 and 4 are just as busy, on work the GPU never waits for. -->
      <g>
        <rect x="90" y="106" width="720" height="32" rx="4" fill="#9aa9b6"/>
        <text x="360" y="127">background CPU job</text>
      </g>
      <g>
        <rect x="90" y="144" width="720" height="32" rx="4" fill="#9aa9b6"/>
        <text x="360" y="165">background CPU job</text>
      </g>
    </g>

    <!-- GPU: a pair of batches every 180 units, which it gets through in 140,
         so it waits 40 for the next pair. -->
    <g mask="url(#fadeRight)">
      <rect x="90"  y="192" width="180" height="44" rx="4" fill="url(#idleHatch)" stroke="#f8961d" stroke-width="1.5" stroke-dasharray="5 3"/>
      <rect x="270" y="192" width="70" height="44" rx="4" fill="#1f3f63"/>
      <rect x="340" y="192" width="70" height="44" rx="4" fill="#1f3f63"/>
      <rect x="410" y="192" width="40" height="44" rx="4" fill="url(#idleHatch)" stroke="#f8961d" stroke-width="1.5" stroke-dasharray="5 3"/>
      <rect x="450" y="192" width="70" height="44" rx="4" fill="#1f3f63"/>
      <rect x="520" y="192" width="70" height="44" rx="4" fill="#1f3f63"/>
      <rect x="590" y="192" width="40" height="44" rx="4" fill="url(#idleHatch)" stroke="#f8961d" stroke-width="1.5" stroke-dasharray="5 3"/>
      <rect x="630" y="192" width="70" height="44" rx="4" fill="#1f3f63"/>
      <path d="M 340 192 L 340 236 M 520 192 L 520 236" stroke="#23abe3" stroke-width="1.5" opacity="0.55"/>
      <g text-anchor="middle">
        <text x="180" y="219" font-size="13" fill="#f8b45a">waiting for batch 1</text>
        <text x="305" y="219" font-size="11" fill="#e9f1f7">compute 1</text>
        <text x="375" y="219" font-size="11" fill="#e9f1f7">compute 2</text>
        <text x="430" y="219" font-size="12" fill="#f8b45a">idle</text>
        <text x="485" y="219" font-size="11" fill="#e9f1f7">compute 3</text>
        <text x="555" y="219" font-size="11" fill="#e9f1f7">compute 4</text>
        <text x="610" y="219" font-size="12" fill="#f8b45a">idle</text>
      </g>
    </g>

    <!-- "and so on" -->
    <g font-size="20" fill="#c3d4e0" opacity="0.6" text-anchor="middle">
      <text x="668" y="54">…</text>
      <text x="668" y="92">…</text>
      <text x="668" y="130">…</text>
      <text x="668" y="168">…</text>
      <text x="668" y="222">…</text>
    </g>

    <!-- Handoffs come from cores 1 and 2 only, straight past the background job. -->
    <g stroke="#c3d4e0" stroke-width="1.3" opacity="0.6" stroke-dasharray="3 2" marker-end="url(#handoff)">
      <path d="M 270 102 L 270 189"/>
      <path d="M 450 102 L 450 189"/>
    </g>

    <!-- Time -->
    <path d="M 90 256 L 648 256" stroke="#c3d4e0" stroke-width="1.3" opacity="0.6" marker-end="url(#timeArrow)"/>
    <text x="660" y="260" font-size="12" fill="#c3d4e0" opacity="0.85">time</text>

    <!-- Legend -->
    <g font-size="12" fill="#c3d4e0">
      <rect x="90" y="278" width="12" height="12" rx="2" fill="#23abe3"/>
      <text x="108" y="288">CPU preparing a batch</text>

      <rect x="240" y="278" width="12" height="12" rx="2" fill="#9aa9b6"/>
      <text x="258" y="288">CPU on other work</text>

      <rect x="372" y="278" width="12" height="12" rx="2" fill="#1f3f63"/>
      <text x="390" y="288">GPU computing</text>

      <rect x="482" y="278" width="12" height="12" rx="2" fill="url(#idleHatch)" stroke="#f8961d" stroke-width="1.2"/>
      <text x="500" y="288">GPU idle, waiting for work</text>
    </g>

  </g>
</svg>
