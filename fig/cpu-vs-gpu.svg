<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300" role="img" aria-label="A CPU has a few powerful cores, each doing a different job. A GPU has thousands of simple cores that all apply the same instruction at once, each to its own piece of data.">
  <title>A CPU and a GPU, side by side</title>
  <desc>On the left, eight large CPU cores, each labelled with a different job: read, decide, parse, sort, write, search, wait, branch. On the right, a grid of 192 small GPU cores under one instruction, times two. A row of numbers enters the grid and each column comes out doubled: the same instruction, applied to different data at the same time.</desc>

  <defs>
    <!-- One small core every 13 units; the grid below is filled with it. -->
    <pattern id="gpuCores" x="366" y="104" width="13" height="13" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" rx="2" fill="#001c36"/>
    </pattern>
  </defs>

  <g font-family="Mukta, 'Helvetica Neue', Helvetica, Arial, sans-serif">

    <!-- Headings -->
    <g text-anchor="middle">
      <text x="165" y="30" font-size="15" font-weight="700" fill="#001c36">CPU</text>
      <text x="165" y="48" font-size="12" fill="#0b2139" opacity="0.7">a few powerful cores</text>
      <text x="520" y="30" font-size="15" font-weight="700" fill="#001c36">GPU</text>
      <text x="520" y="48" font-size="12" fill="#0b2139" opacity="0.7">thousands of simple cores; a couple of hundred shown</text>
    </g>

    <!-- CPU: each core is busy with a job of its own. -->
    <g font-size="12" fill="#00263f" font-weight="600" text-anchor="middle">
      <rect x="25" y="100" width="64" height="52" rx="4" fill="#23abe3"/>
      <text x="57" y="130">read</text>
      <rect x="97" y="100" width="64" height="52" rx="4" fill="#23abe3"/>
      <text x="129" y="130">decide</text>
      <rect x="169" y="100" width="64" height="52" rx="4" fill="#23abe3"/>
      <text x="201" y="130">parse</text>
      <rect x="241" y="100" width="64" height="52" rx="4" fill="#23abe3"/>
      <text x="273" y="130">sort</text>
      <rect x="25" y="160" width="64" height="52" rx="4" fill="#23abe3"/>
      <text x="57" y="190">write</text>
      <rect x="97" y="160" width="64" height="52" rx="4" fill="#23abe3"/>
      <text x="129" y="190">search</text>
      <rect x="169" y="160" width="64" height="52" rx="4" fill="#23abe3"/>
      <text x="201" y="190">wait</text>
      <rect x="241" y="160" width="64" height="52" rx="4" fill="#23abe3"/>
      <text x="273" y="190">branch</text>
    </g>

    <!-- GPU: one instruction for every core... -->
    <rect x="450" y="60" width="140" height="22" rx="4" fill="#001c36"/>
    <text x="520" y="75" font-size="12" fill="#e9f1f7" text-anchor="middle">same instruction: × 2</text>

    <!-- ...each core with its own number going in, and its own result coming out. -->
    <g font-size="9" fill="#0b2139" opacity="0.7" text-anchor="middle">
      <text x="371" y="96">3</text>
      <text x="384" y="96">8</text>
      <text x="397" y="96">1</text>
      <text x="410" y="96">5</text>
      <text x="423" y="96">9</text>
      <text x="436" y="96">2</text>
      <text x="449" y="96">7</text>
      <text x="462" y="96">4</text>
      <text x="475" y="96">6</text>
      <text x="488" y="96">0</text>
      <text x="501" y="96">3</text>
      <text x="514" y="96">9</text>
      <text x="527" y="96">5</text>
      <text x="540" y="96">1</text>
      <text x="553" y="96">8</text>
      <text x="566" y="96">2</text>
      <text x="579" y="96">7</text>
      <text x="592" y="96">6</text>
      <text x="605" y="96">4</text>
      <text x="618" y="96">9</text>
      <text x="631" y="96">0</text>
      <text x="644" y="96">3</text>
      <text x="657" y="96">5</text>
      <text x="670" y="96">8</text>
      <text x="371" y="220">6</text>
      <text x="384" y="220">16</text>
      <text x="397" y="220">2</text>
      <text x="410" y="220">10</text>
      <text x="423" y="220">18</text>
      <text x="436" y="220">4</text>
      <text x="449" y="220">14</text>
      <text x="462" y="220">8</text>
      <text x="475" y="220">12</text>
      <text x="488" y="220">0</text>
      <text x="501" y="220">6</text>
      <text x="514" y="220">18</text>
      <text x="527" y="220">10</text>
      <text x="540" y="220">2</text>
      <text x="553" y="220">16</text>
      <text x="566" y="220">4</text>
      <text x="579" y="220">14</text>
      <text x="592" y="220">12</text>
      <text x="605" y="220">8</text>
      <text x="618" y="220">18</text>
      <text x="631" y="220">0</text>
      <text x="644" y="220">6</text>
      <text x="657" y="220">10</text>
      <text x="670" y="220">16</text>
      <text x="358" y="96" text-anchor="end">data</text>
      <text x="358" y="220" text-anchor="end">result</text>
    </g>
    <rect x="366" y="104" width="309" height="101" fill="url(#gpuCores)"/>

    <!-- Captions -->
    <g font-size="12" fill="#0b2139">
      <text x="165" y="262" font-size="13" text-anchor="middle">Each core can do something different.</text>
      <text x="165" y="280" opacity="0.7" text-anchor="middle">Good at decisions, and one step after another.</text>
      <text x="520" y="262" font-size="13" text-anchor="middle">Every core does the same thing, to different data.</text>
      <text x="520" y="280" opacity="0.7" text-anchor="middle">Good at the same arithmetic over huge arrays.</text>
    </g>

  </g>
</svg>
